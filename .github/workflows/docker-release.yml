name: docker-release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_all:
        description: Build and publish all dockerized apps regardless of version diff
        required: false
        type: boolean
        default: false

concurrency:
  group: docker-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version bumps for dockerized apps
        id: detect
        env:
          FORCE_ALL: ${{ inputs.force_all }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const cp = require('node:child_process');

          const base = process.env.GITHUB_EVENT_BEFORE && process.env.GITHUB_EVENT_BEFORE !== '0000000000000000000000000000000000000000'
            ? process.env.GITHUB_EVENT_BEFORE
            : 'HEAD~1';
          const head = process.env.GITHUB_SHA || 'HEAD';
          const forceAll = process.env.GITHUB_EVENT_NAME === 'workflow_dispatch' && process.env.FORCE_ALL === 'true';

          const diff = cp.execSync(
            forceAll
              ? `git ls-files 'apps/*/package.json'`
              : `git diff --name-only ${base} ${head} -- 'apps/*/package.json'`,
            { encoding: 'utf8' }
          ).trim();

          const files = diff ? diff.split('\n').filter(Boolean) : [];
          const include = [];

          for (const file of files) {
            if (!fs.existsSync(file)) continue;

            const dir = path.dirname(file);
            const dockerfile = path.join(dir, 'Dockerfile');
            const projectJsonPath = path.join(dir, 'project.json');

            if (!fs.existsSync(dockerfile)) continue;

            const nextPkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            const nextVersion = nextPkg.version;
            if (!nextVersion) continue;

            let prevVersion = '';
            try {
              const prevRaw = cp.execSync(`git show ${base}:${file}`, { encoding: 'utf8' });
              prevVersion = JSON.parse(prevRaw).version || '';
            } catch {
              // First publish case: package file does not exist at base revision.
              // Keep prevVersion empty so the image is included.
            }

            if (!forceAll && prevVersion === nextVersion) continue;

            const projectName = fs.existsSync(projectJsonPath)
              ? JSON.parse(fs.readFileSync(projectJsonPath, 'utf8')).name
              : path.basename(dir);

            const imageName = path.basename(dir);

            include.push({
              project: projectName,
              package_file: file,
              context: '.',
              dockerfile,
              image: `ghcr.io/${process.env.GITHUB_REPOSITORY_OWNER}/${imageName}`.toLowerCase(),
              cache_scope: imageName.toLowerCase(),
              version: nextVersion
            });
          }

          const matrix = JSON.stringify({ include });
          const out = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(out, `matrix=${matrix}\n`);
          fs.appendFileSync(out, `has_changes=${include.length > 0 ? 'true' : 'false'}\n`);
          JS

  release:
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ matrix.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=${{ matrix.project }}
            org.opencontainers.image.version=${{ matrix.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,scope=${{ matrix.cache_scope }},mode=max
